[ROUTING]
DEFAULT_VENUE      = BINANCE_SPOT
TIME_IN_FORCE      = day             ; day | gtc | opg | cls | ioc | fok
ALLOW_SHORTS       = false
MAX_LEVERAGE       = 1.0
SYMBOL_WHITELIST   = BTCUSDT
[CORE]
version             = V13.2025.10.20.01
mode                = PAPER                ; PAPER = simulated trading
default_symbol      = BTC/USDT
default_timeframe   = 1m
timezone            = UTC+0
log_level           = INFO

[PATHS]
core_dir            = ../core/
docs_dir            = ../docs/
data_dir            = ../data/
logs_dir            = ../logs/
config_dir          = ../config/

[TELEMETRY]
data_map_file       = ../data/V13_DataMap.json
telemetry_config    = ../data/Telemetry_Config.yaml
update_interval_sec = 15
audit_db            = ../logs/Session_Audit_Log.db

[RISK]
max_dd_safe         = -20
max_dd_balanced     = -50
max_dd_aggressive   = -200
joker_trigger_usd   = -150
profit_ladder_1     = 0.20     ; 20% lock at +$50
profit_ladder_2     = 0.80     ; tighten to 80% after +$100

[MODE_FLAGS]
allow_auto_update   = TRUE
allow_manual_override = TRUE
safe_mode_enabled   = TRUE
balanced_mode_enabled = TRUE
aggressive_mode_enabled = TRUE

[USER]
commander_tag       = Commander
operator_name       = V
build_manifest      = ../config/Build_Manifest.json
profile_file        = ../config/User_Profile.cfg

[SECURITY]
hash_list_file      = ../config/Integrity_HashList.md5
verify_on_launch    = TRUE
auto_abort_on_error = TRUE

[LOGGING]
session_log_file    = ../logs/Update_Log.txt
crash_log_file      = ../logs/CrashGuard_EventLog.csv
performance_archive = ../logs/Performance_Record_Archive/
# ============================================================
# V13_Config.ini â€” Core Configuration File
# Build: 2025-10-20 | DDS Default Doctrine Integration
# ============================================================

[System]
Build_ID = V13.2025.10.20.01
Mode = PAPER
Heartbeat_Interval = 60
Logging_Level = INFO

[Doctrine]
# ------------------------------------------------------------
# Default doctrines loaded automatically during launch
# ------------------------------------------------------------
Default_TradeA = Assassins_Plan_V13.json
Default_TradeB = Avengers_Plan_V13.json
Doctrine_Path = ./Videos/bohrn 2025/trade/V13/docs/Doctrine_V13/
Integrity_HashList = Integrity_HashList.md5
Auto_Load_Doctrines = True
Auto_Validate_Hash = True

[Telemetry]
Feed_Symbols = BTC/USDT,ETH/USDT,SOL/USDT
Feed_Source = PAPER_FEED
Refresh_Interval = 1
Simulated_Latency = 0.15

[Risk]
Max_Drawdown_Percent = 2.0
Auto_Joker_Trigger = True
Safe_Mode = Balanced

[Performance]
Profit_Target_Step = 10
Log_History = True
Report_Path = ./Videos/bohrn 2025/trade/V13/logs/Performance_Log.txt

[Heartbeat]
# Heartbeat runtime monitor settings
Enabled = True
Interval = 60
Alert_Level = NORMAL
Log_Path = ./Videos/bohrn 2025/trade/V13/logs/Heartbeat_Log.txt

[MODE]
RUN_ENV            = PAPER           ; PAPER | LIVE
EXECUTION_CHANNEL  = PAPER_POST      ; NONE | GHOST | PAPER_POST | LIVE_POST
DRY_RUN_POST       = false           ; if true, never posts (overrides channel)

[BROKER_ALPACA]
BASE_URL           = https://paper-api.alpaca.markets
DATA_URL           = https://data.alpaca.markets
API_KEY_ID         = <env:ALPACA_KEY_ID>
API_SECRET         = <env:ALPACA_SECRET>

[RISK_LIMITS]
MAX_POS_USD        = 500             ; per symbol
MAX_GROSS_USD      = 1000            ; across account
MAX_ORDERS_DAY     = 20
MAX_LOSS_DAY       = 50              ; USD lockout
MAX_LOSS_SESSION   = 25
MIN_TRADE_VALUE    = 10


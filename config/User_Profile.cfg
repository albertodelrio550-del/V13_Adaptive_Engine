# ============================================================
# V13 Adaptive Manual Trading Engine — User Profile
# Build_ID: V13.2025.10.20.01
# Location: /Videos/bohrn 2025/trade/V13/config/User_Profile.cfg
# ------------------------------------------------------------
# Defines Commander and Operator identity metadata.
# Loaded at system startup by V13_LaunchSequence.py and 
# CommanderMonitor for tagging, audit, and reporting.
# ============================================================

[IDENTITY]
commander_name      = Commander V
operator_handle     = V
unit_tag            = V13_Stable_Release
auth_level          = FULL
active_mode         = PAPER
home_timezone       = UTC+0

[CONTACT]
email               = commander.v@localhost
telegram_channel    = none
discord_tag         = none

[SESSION]
session_id          = AUTO
auto_generate_id    = TRUE
log_retention_days  = 30
audit_log_path      = ../logs/Session_Audit_Log.db

[PREFERENCES]
theme               = dark
ui_language         = EN
report_format       = markdown
timestamp_format    = %Y-%m-%d %H:%M:%S
display_profit_in   = USD
notifications       = TRUE

[SECURITY]
verify_hash_on_load = TRUE
auto_logout_minutes = 120
profile_hash_key    = INIT_PENDING

